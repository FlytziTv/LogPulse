name: Bug Report
description: Signaler un bug sur LogPulse
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Merci de remplir ce formulaire pour signaler un bug.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décris le bug clairement
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Observer...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Sévérité
      options:
        - Critique
        - Majeur
        - Mineur
    validations:
      required: true
